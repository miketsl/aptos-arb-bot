# Test configuration for file-based replay
transaction_stream_config:
  starting_version: null
  indexer_grpc_data_service_address: "https://grpc.mainnet.aptoslabs.com:443"
  auth_token: "test_token"
  request_name_header: "market-data-ingestor"

# Enhanced ingestor configuration for production monitoring
ingestor:
  # Data source configuration - using file to avoid gRPC issues
  data_source:
    type: "file"
    path: "./recordings/mainnet_sample.pb"  # Use protobuf file
    replay_speed: 0  # As fast as possible
  
  # Filter configuration
  filters:
    enabled: true
    token_whitelist: ["APT", "USDC", "USDT"]
  
  # Performance and monitoring configuration
  performance:
    max_events_per_batch: 1000
    batch_timeout_ms: 100
    channel_buffer_size: 10000
    latency_warning_threshold_ms: 1000
    metrics_enabled: true
    metrics_port: 8080  # HTTP server for dashboard and Prometheus metrics
  
  # DEX adapter configurations
  adapters:
    - name: "Hyperion"
      module_address: "0x89576037b3cc0b89645ea393a47787bb348272c76d6941c574b053672b848039"
      enabled: true
      events:
        swap: "::pool::SwapAfterEvent"
        snapshot: "::pool::PoolSnapshot"
      settings: {}

  # Pool state management configuration
  pool_state:
    cache_ttl_seconds: 300
    max_cache_size: 10000
    fetch_timeout_ms: 5000
    max_concurrent_fetches: 10
    retry_attempts: 3

# Legacy market data config (kept for backward compatibility)
market_data_config:
  data_source:
    type: "file"
    path: "./recordings/mainnet_sample.pb"
    replay_speed: 1.0
  filters:
    mode: "all"
  dexs: 
    - name: "Hyperion"
      module_address: "0x89576037b3cc0b89645ea393a47787bb348272c76d6941c574b053672b848039"
      events:
        swap: "::pool::SwapAfterEvent"
      settings: {}

detector_config:
  strategies: []